name: Build native apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # A manual run on any branch builds/verifies the Android APK only. Turning
      # this on reproduces the full push behaviour (Windows installers + publish).
      publish:
        description: 'Also build & publish the Windows installers and the release'
        type: boolean
        default: false
      minor:
        description: 'Bump the MINOR segment instead of the patch (e.g. v0.2.21 -> v0.3.0)'
        type: boolean
        default: false

jobs:
  # Single version authority for the whole run. The version is derived from the
  # newest published v* tag (NOT from package.json), then checked against the
  # remote right before release so a repeated push can never clobber an
  # already-published release's assets. android/windows/release consume it via
  # needs; no job ever recomputes it.
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History + tags: the version source of truth is the tag list.
          fetch-depth: 0
      - id: calc
        name: Compute next version from published tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINOR_BUMP: ${{ inputs.minor }}
        run: |
          set -euo pipefail
          # Newest published release tag (releases, not raw git tags, because
          # electron-builder publishes GitHub releases).
          LAST=$(gh release list --repo "${{ github.repository }}" --limit 20 --json tagName --jq '
            map(.tagName | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$")))
            | sort_by(sub("^v"; "") | split(".") | map(tonumber))
            | last // "v0.0.0"'
          )
          echo "last published: $LAST"
          # Minor releases (feature batches) bump the middle segment; the
          # default stays patch+1. Driven by the `minor` dispatch input,
          # passed via env so a push event (empty inputs) cannot break the
          # shell quoting.
          VER="${LAST#v}"
          MAJOR=$(printf '%s' "$VER" | cut -d. -f1)
          MINOR=$(printf '%s' "$VER" | cut -d. -f2)
          if [ "$MINOR_BUMP" = "true" ]; then
            NEXT="v$(printf '%d.%d.0' "$MAJOR" "$((MINOR + 1))")"
          else
            PATCH=$(printf '%s' "$VER" | cut -d. -f3)
            NEXT="v$(printf '%d.%d.%d' "$MAJOR" "$MINOR" "$((PATCH + 1))")"
          fi
          echo "next: $NEXT"
          # Race guard: if this tag somehow exists already (a second push while
          # the previous run was still publishing), stop here — a later job
          # uploading --clobber would silently overwrite live assets.
          if gh release view "$NEXT" --repo "${{ github.repository }}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$NEXT" | grep -q .; then
            echo "::error::$NEXT already exists upstream. This push would clobber a published release. Land the pending changes first, then push again."
            exit 1
          fi
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK (release-signed)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Test-collection consistency gate: `vitest list` (collected) must equal
      # `vitest run` (executed). Catches silent include-pattern drift — e.g. a
      # test subdirectory falling out of the default glob, which would make
      # suite totals lie while everything still shows green. Cheap (one extra
      # vitest list); fails the whole run before any build minutes are spent.
      - name: Test-collection consistency gate
        working-directory: timetable
        run: npm run test:consistent
      - uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` package no longer exists in the SDK repository, but
          # the action's default package list still requests it, which failed the
          # run with: Warning: Failed to find package 'tools'. platform-tools is
          # all we need here; Gradle auto-downloads the platform and build-tools.
          packages: platform-tools
      - id: bump
        name: Install deps, stamp version & build web assets
        working-directory: timetable
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci
          # Tag-aware stamping: set package.json to the resolved version so the
          # APK's in-app version (VITE_APP_VERSION) matches the release tag,
          # otherwise the Android update check keeps offering an update the
          # user already has. Version numbers come from the `version` job.
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm run build
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Sync Capacitor
        working-directory: timetable
        run: npx cap sync android
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Fail loudly rather than shipping an unsigned (or debug-signed) APK.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - refusing to build a release APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "LUT_KEYSTORE_FILE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: timetable/android
        env:
          LUT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${{ steps.bump.outputs.version }}"
          # 0.2.13 -> 2013; monotonic across releases.
          CODE=$(awk -F. '{printf "%d", $1*1000000 + $2*1000 + $3}' <<< "$VERSION")
          ./gradlew assembleRelease --no-daemon \
            -PLUT_VERSION_NAME="$VERSION" -PLUT_VERSION_CODE="$CODE"
      - name: Verify the APK (release key, plugins survived R8, version matches)
        working-directory: timetable/android
        env:
          # Public fingerprint of the release signing key (keytool -list -v).
          # A mismatch means the APK would not be installable as an update.
          RELEASE_CERT_SHA256: c09c0f86fc36f0c971b0208f8a03292e81709259f170266100213a4c8cd5a8e7
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::release APK was not produced ($APK missing)"
            exit 1
          fi
          ls -l "$APK"

          # 1. Signed with the release key: a different key means existing
          #    installs could never be updated.
          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
            grep -qi "$RELEASE_CERT_SHA256" /tmp/certs.txt \
              || { echo "::error::APK is not signed with the release key (cert digest mismatch)"; exit 1; }
          else
            echo "::warning::apksigner not found; falling back to the signing-block check"
            grep -qa 'APK Sig Block 42' "$APK" \
              || { echo "::error::APK is not signed (no APK Signing Block)"; exit 1; }
          fi

          # 2. R8 must not have stripped the reflectively-discovered plugins.
          unzip -p "$APK" 'classes*.dex' > /tmp/dex.bin
          for cls in FilesystemPlugin SharePlugin LocalNotificationsPlugin; do
            grep -qa "$cls" /tmp/dex.bin \
              || { echo "::error::$cls was stripped by R8"; exit 1; }
            echo "kept: $cls"
          done

          # 3. The in-app version drives the Android update check.
          unzip -p "$APK" 'assets/public/assets/index-*.js' > /tmp/bundle.js
          grep -qa "$VERSION" /tmp/bundle.js \
            || { echo "::error::web bundle does not embed $VERSION"; exit 1; }
          echo "web bundle embeds $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: timetable/android/app/build/outputs/apk/release/app-release.apk

  windows:
    name: Windows (Electron)
    if: github.event_name == 'push' || inputs.publish
    needs: [android, version]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - id: bump
        name: Install deps & build & publish
        shell: bash
        working-directory: timetable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm ci
          # Stamp the tag-derived version so electron-builder packages and
          # publishes exactly that release (electron-updater sees a new
          # version on every push because the tag always advances).
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Build AFTER the stamp so VITE_APP_VERSION in the web bundle matches
          # the packaged installer version ("已是最新版本" banner must show the
          # real running version).
          npm run build
          npx electron-builder --win nsis msi --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            timetable/release-electron/*.exe
            timetable/release-electron/*.msi

  ios:
    name: iOS (compile check, simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - name: Install deps & build web assets
        working-directory: timetable
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        working-directory: timetable
        run: npx cap sync ios
      # Xcode 生成工程已提交；SPM 插件解析在 build 期间自动完成（无需 CocoaPods）。
      - name: Build iOS (simulator, unsigned)
        working-directory: timetable/ios/App
        run: |
          xcodebuild -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | tail -30
      - name: Verify .app product exists
        run: test -d timetable/ios/App/build/Build/Products/Debug-iphonesimulator/App.app && echo "App.app built"

  release:
    name: Attach APK to GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs: [android, windows, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.windows.outputs.version }}"
          gh release upload "$TAG" apk/*.apk --clobber --repo "${{ github.repository }}"
          echo "APK attached to $TAG"

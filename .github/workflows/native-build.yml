name: Build native apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install deps & build web assets
        working-directory: timetable
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        working-directory: timetable
        run: npx cap sync android
      - name: Build debug APK
        working-directory: timetable/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: timetable/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps & build installer
        working-directory: timetable
        run: |
          npm ci
          npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: timetable/src-tauri/target/release/bundle/

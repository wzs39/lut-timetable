name: Build native apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install deps & build web assets
        working-directory: timetable
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        working-directory: timetable
        run: npx cap sync android
      - name: Build debug APK
        working-directory: timetable/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: timetable/android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows (Electron)
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - id: bump
        name: Install deps & build & publish
        shell: bash
        working-directory: timetable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          # Auto-increment patch version so electron-updater sees a new version
          # on every push and prompts users to update.
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # Build AFTER the bump so VITE_APP_VERSION in the web bundle matches
          # the packaged installer version ("已是最新版本" banner must show the
          # real running version).
          npm run build
          npx electron-builder --win nsis msi --publish always
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            timetable/release-electron/*.exe
            timetable/release-electron/*.msi

  ios:
    name: iOS (compile check, simulator, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: timetable/package-lock.json
      - name: Install deps & build web assets
        working-directory: timetable
        run: |
          npm ci
          npm run build
      - name: Sync Capacitor
        working-directory: timetable
        run: npx cap sync ios
      # Xcode 生成工程已提交；SPM 插件解析在 build 期间自动完成（无需 CocoaPods）。
      - name: Build iOS (simulator, unsigned)
        working-directory: timetable/ios/App
        run: |
          xcodebuild -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | tail -30
      - name: Verify .app product exists
        run: test -d timetable/ios/App/build/Build/Products/Debug-iphonesimulator/App.app && echo "App.app built"

  release:
    name: Attach APK to GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.windows.outputs.version }}"
          gh release upload "$TAG" apk/*.apk --clobber --repo "${{ github.repository }}"
          echo "APK attached to $TAG"
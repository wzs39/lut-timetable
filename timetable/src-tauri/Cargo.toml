[package]
name = "lut-timetable"
version = "0.1.0"
description = "LUT/LAB Timetable viewer with SISU & TimeEdit sync"
edition = "2021"

[lib]
name = "lut_timetable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

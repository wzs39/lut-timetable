apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// --- Release signing ---------------------------------------------------------
// The keystore is never stored in the repository. CI decodes it from the
// ANDROID_KEYSTORE_BASE64 secret into a temp file and passes the path plus the
// passwords through the environment; a local build can use the same names as
// Gradle properties (-PLUT_KEYSTORE_FILE=... etc.). When nothing is configured
// the release build simply stays unsigned instead of silently using the debug
// key.
def signingValue = { String name -> System.getenv(name) ?: project.findProperty(name) }
def releaseStoreFile = signingValue('LUT_KEYSTORE_FILE')
def releaseStorePassword = signingValue('LUT_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('LUT_KEY_ALIAS')
def releaseKeyPassword = signingValue('LUT_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && file(releaseStoreFile).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "dev.lut.timetable"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.lut.timetable"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes the release version so the package identifies itself exactly
        // like the tag it was published under; local builds keep the defaults.
        // Assignment form is required here: the command form `versionCode (x).toInteger()`
        // parses as `versionCode(x).toInteger()` — the setter gets the raw String and
        // .toInteger() runs on its null return ("Value is null" at configure time).
        versionCode = (project.findProperty('LUT_VERSION_CODE') ?: '1').toInteger()
        versionName = project.findProperty('LUT_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Defined only when a keystore is actually configured, so an unconfigured
        // build cannot end up with an empty (invalid) signing config.
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // Distributable build. The dex is ~80% of this APK, so shrinking the
            // code (plus resources) is where the size actually goes; the release
            // variant also drops the debugging metadata the debug build carries.
            // Capacitor's library ships the consumer keep rules for plugin
            // classes — see proguard-rules.pro for the extras we add.
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 后台刷新的隐藏 WebView 宿主（WebViewAssetLoader：把 assets 挂在 https origin，
    // 否则 ES module 在 file:// 会被 CORS 拦住）。版本已在 variables.gradle 里。
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
